<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulatore B10 REEV Finale</title>
<style>
  body { background: #121826; color: #e2e8f0; font-family: sans-serif; padding: 20px; }
  .container { max-width: 600px; margin: auto; background: #1e293b; padding: 20px; border-radius: 10px; }
  h2 { color: #2dd4bf; margin-bottom: 20px; }
  label { display: flex; justify-content: space-between; margin-top: 15px; font-size: 14px; font-weight: bold; }
  input[type=range] { width: 100%; margin-top: 8px; accent-color: #2dd4bf; }
  input[type=number] { width: 80px; padding: 5px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
  .box { background: #0f172a; padding: 15px; border-radius: 8px; text-align: center; }
  .box span { display: block; font-size: 20px; color: #38bdf8; font-weight: bold; margin-top: 5px; }
  .box-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
  .summary { margin-top: 20px; padding: 15px; background: #064e3b; border-radius: 8px; }
  .summary-row { display: flex; justify-content: space-between; margin-top: 10px; font-size: 16px; font-weight: bold; }
  .total-dist { font-size: 18px; color: #fbbf24; border-bottom: 1px solid #047857; padding-bottom: 10px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="container">
  <h2>Simulatore B10 REEV Definitivo</h2>

  <label>Velocità Costante: <span id="v_val">80 km/h</span></label>
  <input type="range" id="v" min="0" max="170" step="10" value="80" oninput="calc()">

  <label>SOC Partenza (%): <span id="soc_start_val">100</span></label>
  <input type="range" id="soc_start" min="0" max="100" step="1" value="100" oninput="calc()">

  <label>SOC Mantenimento (%): <span id="soc_target_val">15</span></label>
  <input type="range" id="soc_target" min="0" max="100" step="1" value="15" oninput="calc()">

  <div style="background: #334155; padding: 10px; border-radius: 5px; margin-top: 15px;">
    <div style="font-size: 14px; font-weight: bold; color: #cbd5e1;">Batteria Disponibile: <span id="kwh_disp" style="color: #6ee7b7;">16.0</span> kWh</div>
    <div style="font-size: 14px; font-weight: bold; color: #cbd5e1; margin-top: 5px;">Autonomia EV Max Stimata: <span id="ev_max_val" style="color: #6ee7b7;">100</span> km</div>
  </div>

  <label>Km in Elettrico Puro: <span id="km_ev_val">50 km</span></label>
  <input type="range" id="km_ev" min="0" max="100" step="1" value="50" oninput="calc()">

  <label>Km a Carburante (Mantenimento): <span id="km_fuel_val">50 km</span></label>
  <input type="range" id="km_fuel" min="0" max="1000" step="1" value="50" oninput="calc()">

  <div class="grid">
    <div>
      <label style="margin-top:0;">Prezzo Benzina (€/L)</label>
      <input type="number" id="p_gas" value="1.80" step="0.01" oninput="calc()">
    </div>
    <div>
      <label style="margin-top:0;">Prezzo Corrente (€/kWh)</label>
      <input type="number" id="p_ele" value="0.25" step="0.01" oninput="calc()">
    </div>
  </div>

  <div class="grid">
    <div class="box"><div class="box-title">Consumo EV</div><span id="c_ev">0.0 kWh/100km</span></div>
    <div class="box"><div class="box-title">Consumo Fuel</div><span id="c_fuel">0.0 l/100km</span></div>
  </div>

  <div class="summary">
    <div class="summary-row total-dist"><span>Distanza Totale Viaggio:</span><span id="dist_tot">100 km</span></div>
    <div class="summary-row"><span>Spesa Elettrica:</span><span id="costo_ev">€ 0.00</span></div>
    <div class="summary-row"><span>Spesa Benzina:</span><span id="costo_fuel">€ 0.00</span></div>
    <div class="summary-row" style="color: #34d399; font-size: 20px; border-top: 1px solid #047857; padding-top: 10px; margin-top: 10px;">
      <span>Spesa Totale:</span><span id="costo_tot">€ 0.00</span>
    </div>
  </div>
</div>

<script>
  const BATTERY_KWH = 18.8;

  function calc() {
    let v_slider = parseInt(document.getElementById('v').value);
    let soc_start = parseInt(document.getElementById('soc_start').value);
    let soc_target = parseInt(document.getElementById('soc_target').value);
    let km_fuel = parseInt(document.getElementById('km_fuel').value);

    let is_urbano = (v_slider === 0);
    let v = is_urbano ? 30 : v_slider;
    let v_text = is_urbano ? 'Urbano' : v_slider + ' km/h';

    if (soc_target > soc_start) {
        soc_target = soc_start;
        document.getElementById('soc_target').value = soc_target;
    }

    document.getElementById('v_val').innerText = v_text;
    document.getElementById('soc_start_val').innerText = soc_start + '%';
    document.getElementById('soc_target_val').innerText = soc_target + '%';
    document.getElementById('km_fuel_val').innerText = km_fuel + ' km';

    let k_aero = 0.0004237;
    let p_aero = k_aero * Math.pow(v / 3.6, 3);
    let k_roll = 0.1767;
    let p_roll = k_roll * (v / 3.6);
    let p_ruote = p_aero + p_roll;
    let p_extra = 1.5;
    let p_richiesta = (p_ruote * 1.11) + p_extra;

    let c_ev = (p_richiesta * 100) / v;
    if (is_urbano) {
        c_ev = 16.5;
    }
    document.getElementById('c_ev').innerText = c_ev.toFixed(1) + ' kWh/100km';

    let kwh_disp = BATTERY_KWH * (soc_start - soc_target) / 100;
    document.getElementById('kwh_disp').innerText = kwh_disp.toFixed(1);

    let max_ev_km = (kwh_disp / c_ev) * 100;
    if (max_ev_km < 0) max_ev_km = 0;
    document.getElementById('ev_max_val').innerText = max_ev_km.toFixed(0);

    let km_ev_input = document.getElementById('km_ev');
    km_ev_input.max = Math.floor(max_ev_km);
    if (parseInt(km_ev_input.value) > Math.floor(max_ev_km)) {
        km_ev_input.value = Math.floor(max_ev_km);
    }
    let km_ev = parseInt(km_ev_input.value);
    if (isNaN(km_ev)) km_ev = 0;
    document.getElementById('km_ev_val').innerText = km_ev + ' km';

    let eff = 3.8;
    if (is_urbano) {
        eff = 3.9;
    } else if (v > 50) {
        eff = 3.8 - ((v - 50) * 0.01);
    }
    if (eff < 2.5) eff = 2.5;
    
    let c_fuel = c_ev / eff;
    document.getElementById('c_fuel').innerText = c_fuel.toFixed(1) + ' l/100km';

    let dist_tot = km_ev + km_fuel;
    document.getElementById('dist_tot').innerText = dist_tot + ' km';

    let p_gas = parseFloat(document.getElementById('p_gas').value);
    let p_ele = parseFloat(document.getElementById('p_ele').value);

    let kwh_usati = (km_ev / 100) * c_ev;
    let costo_ev = kwh_usati * p_ele;

    let litri_usati = (km_fuel / 100) * c_fuel;
    let costo_fuel = litri_usati * p_gas;

    let costo_tot = costo_ev + costo_fuel;

    document.getElementById('costo_ev').innerText = '€ ' + costo_ev.toFixed(2);
    document.getElementById('costo_fuel').innerText = '€ ' + costo_fuel.toFixed(2);
    document.getElementById('costo_tot').innerText = '€ ' + costo_tot.toFixed(2);
  }
  window.onload = calc;
</script>
</body>
</html>
